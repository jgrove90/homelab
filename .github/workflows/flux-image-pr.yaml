name: Flux Image Update - Open PR

on:
  push:
    branches:
      - app-image-update

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: flux-image-pr
  cancel-in-progress: false

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: app-image-update

      - name: Create PR if needed
        id: pr
        env:
          GH_TOKEN: ${{ secrets.FLUX_ACTIONS }}
        run: |
          PR_NUMBER=$(gh pr list --repo "${{ github.repository }}" \
            --head app-image-update --base main --state open \
            --json number --jq '.[0].number')

          if [ -z "$PR_NUMBER" ]; then
            PR_URL=$(gh pr create --repo "${{ github.repository }}" \
              --base main --head app-image-update \
              --title "Update container images" \
              --body "Automated image update generated by Flux.")
            PR_NUMBER=$(gh pr view "$PR_URL" --json number --jq '.number')
          fi

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.FLUX_ACTIONS }}
        run: |
          for i in 1 2 3 4 5; do
            if gh pr merge "${{ steps.pr.outputs.pr_number }}" \
                --repo "${{ github.repository }}" \
                --auto --squash --delete-branch; then
              exit 0
            fi
            echo "auto-merge not accepted yet (attempt $i/5), retrying in 10s..."
            sleep 10
          done
          exit 1