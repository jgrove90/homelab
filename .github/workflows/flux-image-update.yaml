name: Flux Image Update

on:
  push:
    branches:
      - app-image-update

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create pull request if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER=$(gh pr list \
            --repo "${{ github.repository }}" \
            --head app-image-update \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -z "$PR_NUMBER" ]; then
            echo "Creating pull request..."

            gh pr create \
              --repo "${{ github.repository }}" \
              --base main \
              --head app-image-update \
              --title "Update container images" \
              --body "Automated image update generated by Flux."

            echo "Pull request created."
          else
            echo "Pull request #$PR_NUMBER already exists."
          fi

      - name: Install Kustomize
        run: |
          curl -sS https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh | bash
          sudo mv kustomize /usr/local/bin/kustomize

      - name: Validate cluster manifests
        run: |
          kustomize build kubernetes/clusters/home/4-apps > /tmp/rendered.yaml

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER=$(gh pr list \
            --repo "${{ github.repository }}" \
            --head app-image-update \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -z "$PR_NUMBER" ]; then
            echo "No open image update PR found."
            exit 1
          fi

          echo "Enabling auto-merge for PR #$PR_NUMBER"

          gh pr merge "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --auto \
            --squash \
            --delete-branch
