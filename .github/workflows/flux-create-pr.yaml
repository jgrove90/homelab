name: Create Flux Image Update PR

on:
  push:
    branches:
      - app-image-update

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create pull request if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OPEN_PRS=$(gh pr list \
            --repo "${{ github.repository }}" \
            --head app-image-update \
            --base main \
            --state open \
            --json number \
            --jq 'length')

          if [ "$OPEN_PRS" -eq 0 ]; then
            gh pr create \
              --repo "${{ github.repository }}" \
              --base main \
              --head app-image-update \
              --title "Update container images" \
              --body "Automated image update generated by Flux."
          else
            echo "Pull request already exists."
          fi
