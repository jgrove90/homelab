name: Create Flux Image Update PR

on:
  push:
    branches:
      - app-image-update

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Create pull request if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh pr list \
            --head app-image-update \
            --base main \
            --state open \
            --json number \
            --jq 'length' | grep -q '^0$'; then

            gh pr create \
              --base main \
              --head app-image-update \
              --title "Update container images" \
              --body "Automated image update generated by Flux."
          else
            echo "Pull request already exists."
          fi