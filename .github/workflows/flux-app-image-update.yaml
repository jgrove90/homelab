name: Flux Image Update

on:
  push:
    branches:
      - app-image-update

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create pull request if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER=$(gh pr list \
            --repo "${{ github.repository }}" \
            --head app-image-update \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -z "$PR_NUMBER" ]; then
            echo "Creating pull request..."

            PR_URL=$(gh pr create \
              --repo "${{ github.repository }}" \
              --base main \
              --head app-image-update \
              --title "Update container images" \
              --body "Automated image update generated by Flux.")

            echo "Created: $PR_URL"

            PR_NUMBER=$(gh pr view "$PR_URL" \
              --repo "${{ github.repository }}" \
              --json number \
              --jq '.number')
          else
            echo "Pull request #$PR_NUMBER already exists."
          fi

          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"

      - name: Install Kustomize
        run: |
          curl -sS https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh | bash
          sudo mv kustomize /usr/local/bin/kustomize

      - name: Validate cluster manifests
        run: |
          kustomize build kubernetes/clusters/home/4-apps > /tmp/rendered.yaml

      - name: Capture image changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CHANGES=$(gh pr diff "$PR_NUMBER" \
            --repo "${{ github.repository }}" |
            awk '
              /^-.*image: / {
                old=$0
                sub(/^.*image: /, "", old)
                sub(/[[:space:]]+#.*/, "", old)
                sub(/[[:space:]]+$/, "", old)
              }

              /^\+.*image: / {
                new=$0
                sub(/^.*image: /, "", new)
                sub(/[[:space:]]+#.*/, "", new)
                sub(/[[:space:]]+$/, "", new)

                if (old != "" && new != "") {
                  split(old, old_parts, ":")
                  split(new, new_parts, ":")

                  old_tag=old_parts[length(old_parts)]
                  new_tag=new_parts[length(new_parts)]

                  app=new_parts[1]
                  sub(/^.*\//, "", app)

                  printf "%s %s -> %s\n", app, old_tag, new_tag

                  old=""
                  new=""
                }
              }
            ')

          if [ -z "$CHANGES" ]; then
            CHANGES="Image update merged successfully."
          fi

          echo "Image changes:"
          echo "$CHANGES"

          {
            echo 'IMAGE_CHANGES<<EOF'
            echo "$CHANGES"
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Enabling auto-merge for PR #$PR_NUMBER"

          gh pr merge "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --auto \
            --squash \
            --delete-branch

      - name: Wait for PR to merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Waiting for PR #$PR_NUMBER to merge..."

          for i in {1..60}; do
            STATE=$(gh pr view "$PR_NUMBER" \
              --repo "${{ github.repository }}" \
              --json state \
              --jq '.state')

            if [ "$STATE" = "MERGED" ]; then
              echo "PR #$PR_NUMBER merged."
              break
            fi

            echo "PR state: $STATE"
            sleep 10
          done

          if [ "$STATE" != "MERGED" ]; then
            echo "PR did not merge within the timeout."
            exit 1
          fi

      - name: Send ntfy notification
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          curl --fail-with-body \
            -H "Authorization: Bearer ${NTFY_TOKEN}" \
            -H "Title: Kubernetes image update" \
            -H "Priority: default" \
            -H "Tags: white_check_mark" \
            --data-binary "$IMAGE_CHANGES" \
            "${NTFY_URL}/app_update"
