name: Flux Image Update

on:
  push:
    branches:
      - app-image-update

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create pull request if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER=$(gh pr list \
            --repo "${{ github.repository }}" \
            --head app-image-update \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -z "$PR_NUMBER" ]; then
            echo "Creating pull request..."

            PR_URL=$(gh pr create \
              --repo "${{ github.repository }}" \
              --base main \
              --head app-image-update \
              --title "Update container images" \
              --body "Automated image update generated by Flux.")

            echo "Created: $PR_URL"

            PR_NUMBER=$(gh pr view "$PR_URL" \
              --repo "${{ github.repository }}" \
              --json number \
              --jq '.number')
          else
            echo "Pull request #$PR_NUMBER already exists."
          fi

          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"

      - name: Install Kustomize
        run: |
          curl -sS https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh | bash
          sudo mv kustomize /usr/local/bin/kustomize

      - name: Validate cluster manifests
        run: |
          kustomize build kubernetes/clusters/home/4-apps > /tmp/rendered.yaml

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Enabling auto-merge for PR #$PR_NUMBER"

          gh pr merge "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --auto \
            --squash

      - name: Wait for PR to merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Waiting for PR #$PR_NUMBER to merge..."

          for i in {1..60}; do
            STATE=$(gh pr view "$PR_NUMBER" \
              --repo "${{ github.repository }}" \
              --json state \
              --jq '.state')

            if [ "$STATE" = "MERGED" ]; then
              echo "PR #$PR_NUMBER merged."
              break
            fi

            echo "PR state: $STATE"
            sleep 10
          done

          if [ "$STATE" != "MERGED" ]; then
            echo "PR did not merge within the timeout."
            exit 1
          fi

      - name: Send ntfy notification
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          curl --fail-with-body \
            -H "Authorization: Bearer ${NTFY_TOKEN}" \
            -H "Title: Kubernetes update succeeded" \
            -H "Priority: default" \
            -H "Tags: white_check_mark" \
            -d "Flux image update merged successfully into main." \
            "${NTFY_URL}/app_update"
