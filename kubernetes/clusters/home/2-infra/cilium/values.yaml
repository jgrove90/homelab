# DRAFT - Phase 1 of ADR 0001. Used for the initial `helm install` and later copied
# inline into a Flux HelmRelease (same release name/namespace/values so Flux adopts it).
# Not reconciled by Flux: this directory has no kustomization.yaml or flux-system sync.
# Chart: cilium/cilium 1.20.4 (helm repo https://helm.cilium.io)

# Use the pod CIDRs Kubernetes already assigned to nodes (10.244.x.0/24, same as flannel)
ipam:
  mode: kubernetes

# Replace kube-proxy. Talos serves the API locally on every node via KubePrism.
kubeProxyReplacement: true
k8sServiceHost: localhost
k8sServicePort: 7445

# Talos-specific: cgroups are already mounted by Talos
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

# Talos-specific: Talos drops SYS_MODULE, so it is omitted from the capability lists
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

# MetalLB keeps owning LoadBalancer IPs until Phase 5. The chart default
# (lbipam) would make Cilium a competing LoadBalancer IP manager.
defaultLBServiceIPAM: none

# Homelab sizing: one operator is enough
operator:
  replicas: 1

# Deliberately OFF until later phases (ADR 0001):
#   hubble (Phase 2), encryption/wireguard (Phase 3),
#   gatewayAPI (Phase 4), l2announcements/LB-IPAM (Phase 5; MetalLB still owns IPs)
