apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble
  namespace: kube-system

spec:
  parentRefs:
    - name: homelab
      namespace: infra
      sectionName: https

  hostnames:
    - hubble.alarlab.dev

  rules:
    - backendRefs:
        - name: hubble-ui
          port: 80
