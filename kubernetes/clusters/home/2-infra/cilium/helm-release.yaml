apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
  annotations:
    # Never let Flux prune this: deleting the HelmRelease would helm-uninstall the CNI
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  interval: 24h

  upgrade:
    remediation:
      retries: 3

  chart:
    spec:
      chart: cilium
      version: "1.20.4"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: kube-system

  values:
    # Use the pod CIDRs Kubernetes already assigned to nodes (10.244.x.0/24)
    ipam:
      mode: kubernetes

    # Replace kube-proxy. Talos serves the API locally on every node via KubePrism.
    kubeProxyReplacement: true
    k8sServiceHost: localhost
    k8sServicePort: 7445

    # Talos-specific: cgroups are already mounted by Talos
    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup

    # Talos-specific: Talos drops SYS_MODULE, so it is omitted from the capability lists
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE

    # MetalLB keeps owning LoadBalancer IPs until Phase 5. The chart default
    # (lbipam) would make Cilium a competing LoadBalancer IP manager.
    defaultLBServiceIPAM: none

    # Homelab sizing: one operator is enough
    operator:
      replicas: 1

    # Phase 2: Hubble. The agents already serve flows on :4244; Relay aggregates them
    # cluster-wide and the UI shows the service map. Certs come from cert-manager
    # (ClusterIssuer hubble-ca in 2-infra/cert-issuer) so Helm upgrades do not
    # regenerate them. No Ingress: reach the UI with kubectl port-forward until Phase 4.
    hubble:
      tls:
        auto:
          enabled: true
          method: certmanager
          certManagerIssuerRef:
            group: cert-manager.io
            kind: ClusterIssuer
            name: hubble-ca
      relay:
        enabled: true
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
      ui:
        enabled: true
        backend:
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
        frontend:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
