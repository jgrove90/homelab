apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
  annotations:
    # Never let Flux prune this: deleting the HelmRelease would helm-uninstall the CNI
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  interval: 24h

  upgrade:
    remediation:
      retries: 3

  chart:
    spec:
      chart: cilium
      version: "1.20.4"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: kube-system

  values:
    # Use the pod CIDRs Kubernetes already assigned to nodes (10.244.x.0/24)
    ipam:
      mode: kubernetes

    # Replace kube-proxy. Talos serves the API locally on every node via KubePrism.
    kubeProxyReplacement: true
    k8sServiceHost: localhost
    k8sServicePort: 7445

    # Talos-specific: cgroups are already mounted by Talos
    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup

    # Talos-specific: Talos drops SYS_MODULE, so it is omitted from the capability lists
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE

    # With "lbipam", Cilium owns EVERY class-less LoadBalancer Service, and a Service that
    # matches no pool has its IP stripped. Every Service needs an address in the pool
    # (2-infra/cilium-lb). Restart the operator after changing this: it reads it at startup.
    defaultLBServiceIPAM: lbipam

    # L2 announcements (Beta). Each announced Service holds a Lease that its leader
    # renews every 5s. Four Services is ~1 request/s, well inside the default client rate
    # limit; raise k8sClientRateLimit only if Lease renewals start failing.
    l2announcements:
      enabled: true

    # Homelab sizing: one operator is enough
    operator:
      replicas: 1

    # Gateway API: the operator reconciles Gateway/HTTPRoute with Envoy. Needs the Gateway API
    # CRDs (kustomization gateway-api-crds, hence this release's dependsOn). create: "true" so
    # the GatewayClass is not skipped by the chart's CRD auto-detection.
    gatewayAPI:
      enabled: true
      gatewayClass:
        create: "true"

    # Hubble: agents serve flows on :4244, Relay aggregates them cluster-wide, the UI shows the
    # service map. Certs come from cert-manager (ClusterIssuer hubble-ca in 2-infra/cert-issuer)
    # so Helm upgrades do not regenerate them. No route: use kubectl port-forward for the UI.
    hubble:
      tls:
        auto:
          enabled: true
          method: certmanager
          certManagerIssuerRef:
            group: cert-manager.io
            kind: ClusterIssuer
            name: hubble-ca
      relay:
        enabled: true
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
      ui:
        enabled: true
        backend:
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
        frontend:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
