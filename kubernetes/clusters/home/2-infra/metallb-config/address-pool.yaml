apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: first-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.1.110-192.168.1.150
  # Services labelled lb-owner=cilium belong to Cilium LB-IPAM (ADR 0007)
  serviceAllocation:
    serviceSelectors:
      - matchExpressions:
          - key: lb-owner
            operator: NotIn
            values:
              - cilium
