apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ddns-updater
  namespace: infra

  annotations:
    # STAGING: external-dns skips this route while the nginx Ingress still owns the
    # ddns-updater.alarlab.dev DNS record. Removed in the cutover commit (ADR 0006).
    external-dns.alpha.kubernetes.io/controller: ignore

spec:
  parentRefs:
    - name: homelab
      namespace: infra
      sectionName: https

  hostnames:
    - ddns-updater.alarlab.dev

  rules:
    - backendRefs:
        - name: ddns-updater-service
          port: 8000
