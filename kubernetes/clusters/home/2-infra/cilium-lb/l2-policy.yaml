# Which Services Cilium announces on the LAN, and from where (ADR 0008).
# No serviceSelector: every LoadBalancer Service is announced (only four exist). Widened in
# the same commit that removed MetalLB, so there is never a second ARP responder per IP.
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: homelab
spec:
  # Announce from the workers only (the control-plane node is excluded)
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: DoesNotExist
  interfaces:
    - ^ens18$
  loadBalancerIPs: true
