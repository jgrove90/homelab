# Addresses Cilium LB-IPAM may hand out: one /32 per address in use. Each Service requests its
# own (spec.loadBalancerIP, lbipam.cilium.io/ips, or the Gateway's spec.addresses).
# Keep this pool without a serviceSelector: Cilium owns every class-less LoadBalancer Service
# (defaultLBServiceIPAM: lbipam) and strips the IP of any Service that matches no pool.
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: homelab
spec:
  blocks:
    - cidr: 192.168.1.110/32   # Gateway homelab
    - cidr: 192.168.1.115/32   # plex-external
    - cidr: 192.168.1.138/32   # immich-pg-lb
    - cidr: 192.168.1.139/32   # postgres-lb
