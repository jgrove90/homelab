apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring

spec:
  parentRefs:
    - name: homelab
      namespace: infra
      sectionName: https

  hostnames:
    - grafana.alarlab.dev

  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
