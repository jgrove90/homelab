apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 24h
  timeout: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "93.3.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # ---- Prometheus: data on the dedicated worker-02 disk (ADR 0009) ----
    prometheus:
      prometheusSpec:
        retention: 15d
        retentionSize: 30GB   # keep below the 40 GiB volume; Prometheus prunes oldest blocks first
        nodeSelector:
          kubernetes.io/hostname: worker-02
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 35Gi   # local-path does not enforce size; documents intent
        # Discover every ServiceMonitor/PodMonitor/rule in the cluster, not only this release's
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        resources:
          requests:
            cpu: 200m
            memory: 1Gi
          limits:
            memory: 4Gi

    # ---- Alertmanager: dashboard only for now (no receivers), no persistence ----
    alertmanager:
      alertmanagerSpec:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi

    # ---- Grafana: stateless; dashboards come from the chart/sidecar (Git) ----
    grafana:
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      persistence:
        enabled: false
      grafana.ini:
        server:
          root_url: https://grafana.alarlab.dev
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi

    # ---- Cluster components ----
    # kube-proxy was replaced by Cilium: nothing to scrape, and its alerts would always fire
    kubeProxy:
      enabled: false
    defaultRules:
      rules:
        kubeProxy: false

    # Talos runs these as static pods on the control-plane node, not as Services, so the
    # chart needs the node IP. Ports opened by the Talos patch (terraform/patch/control-plane.yaml).
    kubeControllerManager:
      endpoints:
        - 192.168.1.19
      service:
        port: 10257
        targetPort: 10257
      serviceMonitor:
        https: true
        insecureSkipVerify: true   # self-signed serving cert
    kubeScheduler:
      endpoints:
        - 192.168.1.19
      service:
        port: 10259
        targetPort: 10259
      serviceMonitor:
        https: true
        insecureSkipVerify: true
    kubeEtcd:
      endpoints:
        - 192.168.1.19
      service:
        port: 2381
        targetPort: 2381
      serviceMonitor:
        scheme: http   # plain-HTTP metrics port (listen-metrics-urls)

    # ---- Small exporters ----
    kube-state-metrics:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
    prometheus-node-exporter:
      resources:
        requests:
          cpu: 10m
          memory: 24Mi
        limits:
          memory: 64Mi
    prometheusOperator:
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          memory: 256Mi
