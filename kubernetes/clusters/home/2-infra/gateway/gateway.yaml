apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: homelab
  namespace: infra
spec:
  gatewayClassName: cilium

  # LB-IPAM (pool in 2-infra/cilium-lb) gives the Gateway's Service this address.
  # .110 is what the router's wildcard DNS and the 443 port-forward point at.
  addresses:
    - type: IPAddress
      value: 192.168.1.110

  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All

    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-alarlab-tls
      allowedRoutes:
        namespaces:
          from: All
