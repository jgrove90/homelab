apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: homelab
  namespace: infra
spec:
  gatewayClassName: cilium

  # Cilium creates a LoadBalancer Service for this Gateway and LB-IPAM (pool in
  # 2-infra/cilium-lb) assigns the address from spec.addresses, announced over L2 (ADR 0008).
  # .110 is what DNS (router wildcard) and the 443 port-forward point at; the Gateway took it
  # over from ingress-nginx (ADR 0006).
  addresses:
    - type: IPAddress
      value: 192.168.1.110

  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All

    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-alarlab-tls
      allowedRoutes:
        namespaces:
          from: All
