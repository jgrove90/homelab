apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: packetsandpods
  namespace: media

  annotations:
    # STAGING: external-dns skips this route while the nginx Ingress still owns the
    # packetsandpods.com DNS record. Removed in the cutover commit (ADR 0006).
    external-dns.alpha.kubernetes.io/controller: ignore

spec:
  parentRefs:
    - name: homelab
      namespace: infra
      sectionName: https

  hostnames:
    - packetsandpods.com

  rules:
    - backendRefs:
        - name: packetsandpods-service
          port: 80
