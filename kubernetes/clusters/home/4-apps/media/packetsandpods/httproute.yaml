apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: packetsandpods
  namespace: media

spec:
  parentRefs:
    - name: homelab
      namespace: infra
      sectionName: https

  hostnames:
    - packetsandpods.com

  rules:
    - backendRefs:
        - name: packetsandpods-service
          port: 80
