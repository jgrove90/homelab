apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: immich
  namespace: media

  annotations:
    # STAGING: external-dns skips this route while the nginx Ingress still owns the
    # immich.alarlab.dev DNS record. Removed in the cutover commit (ADR 0006).
    external-dns.alpha.kubernetes.io/controller: ignore

spec:
  parentRefs:
    - name: homelab
      namespace: infra
      sectionName: https

  hostnames:
    - immich.alarlab.dev

  rules:
    - backendRefs:
        - name: immich-service
          port: 2283
