apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: audiobookshelf
  namespace: media

  annotations:
    # STAGING: external-dns skips this route while the nginx Ingress still owns the
    # audiobookshelf.alarlab.dev DNS record. Removed in the cutover commit (ADR 0006).
    external-dns.alpha.kubernetes.io/controller: ignore
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
    external-dns.alpha.kubernetes.io/target: "alarlab.dev"

spec:
  parentRefs:
    - name: homelab
      namespace: infra
      sectionName: https

  hostnames:
    - audiobookshelf.alarlab.dev

  rules:
    - backendRefs:
        - name: audiobookshelf
          port: 80
