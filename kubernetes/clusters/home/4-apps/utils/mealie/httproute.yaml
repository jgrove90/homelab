apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mealie
  namespace: utils

  annotations:
    # STAGING: external-dns skips this route while the nginx Ingress still owns the
    # mealie.alarlab.dev DNS record. Removed in the cutover commit (ADR 0006).
    external-dns.alpha.kubernetes.io/controller: ignore
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
    external-dns.alpha.kubernetes.io/target: "alarlab.dev"

spec:
  parentRefs:
    - name: homelab
      namespace: infra
      sectionName: https

  hostnames:
    - mealie.alarlab.dev

  rules:
    - backendRefs:
        - name: mealie-service
          port: 9000
