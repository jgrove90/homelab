apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qbittorrent
  namespace: utils

spec:
  parentRefs:
    - name: homelab
      namespace: infra
      sectionName: https

  hostnames:
    - qbittorrent.alarlab.dev

  rules:
    - backendRefs:
        - name: qbittorrent-service
          port: 8080
