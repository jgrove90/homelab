apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homepage
  namespace: utils

spec:
  parentRefs:
    - name: homelab
      namespace: infra
      sectionName: https

  hostnames:
    - homepage.alarlab.dev

  rules:
    - backendRefs:
        - name: homepage-service
          port: 80
