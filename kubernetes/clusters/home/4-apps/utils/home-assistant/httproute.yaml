apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home-assistant
  namespace: utils

spec:
  parentRefs:
    - name: homelab
      namespace: infra
      sectionName: https

  hostnames:
    - homeassistant.alarlab.dev

  rules:
    - backendRefs:
        - name: home-assistant-service
          port: 8123
