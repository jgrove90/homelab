apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home-assistant
  namespace: utils

  annotations:
    # STAGING: external-dns skips this route while the nginx Ingress still owns the
    # homeassistant.alarlab.dev DNS record. Removed in the cutover commit (ADR 0006).
    external-dns.alpha.kubernetes.io/controller: ignore

spec:
  parentRefs:
    - name: homelab
      namespace: infra
      sectionName: https

  hostnames:
    - homeassistant.alarlab.dev

  rules:
    - backendRefs:
        - name: home-assistant-service
          port: 8123
