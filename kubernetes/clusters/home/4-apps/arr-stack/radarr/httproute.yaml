apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radarr
  namespace: arr-stack

  annotations:
    # STAGING: external-dns skips this route while the nginx Ingress still owns the
    # radarr.alarlab.dev DNS record. Removed in the cutover commit (ADR 0006).
    external-dns.alpha.kubernetes.io/controller: ignore

spec:
  parentRefs:
    - name: homelab
      namespace: infra
      sectionName: https

  hostnames:
    - radarr.alarlab.dev

  rules:
    - backendRefs:
        - name: radarr
          port: 7878
