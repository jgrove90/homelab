apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radarr
  namespace: arr-stack

spec:
  parentRefs:
    - name: homelab
      namespace: infra
      sectionName: https

  hostnames:
    - radarr.alarlab.dev

  rules:
    - backendRefs:
        - name: radarr
          port: 7878
