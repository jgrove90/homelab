apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sonarr
  namespace: arr-stack

spec:
  parentRefs:
    - name: homelab
      namespace: infra
      sectionName: https

  hostnames:
    - sonarr.alarlab.dev

  rules:
    - backendRefs:
        - name: sonarr
          port: 8989
