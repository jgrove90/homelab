apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: home-infra-post
  namespace: flux-system
spec:
  interval: 10m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  path: ./kubernetes/clusters/home/infra/post
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
