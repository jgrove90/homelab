apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: gluetun
  namespace: flux-system
spec:
  image: qmcgaw/gluetun
  interval: 12h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: gluetun
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: gluetun

  policy:
    semver:
      range: ">=1.0.0"