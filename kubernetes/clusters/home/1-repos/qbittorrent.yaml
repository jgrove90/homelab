apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: qbittorrent
  namespace: flux-system
spec:
  image: lscr.io/linuxserver/qbittorrent
  interval: 12h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: qbittorrent
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: qbittorrent

  filterTags:
    pattern: '^(?P<version>[0-9]+\.[0-9]+\.[0-9]+)_v.*$'
    extract: '$version'

  policy:
    semver:
      range: ">=1.0.0"