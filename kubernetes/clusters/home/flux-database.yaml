apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: home-database
  namespace: flux-system
spec:
  interval: 10m
  timeout: 15m
  wait: true
  dependsOn:
    - name: home-infra-post
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  path: ./kubernetes/clusters/home/database
  prune: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cnpg
      namespace: cnpg-system
  sourceRef:
    kind: GitRepository
    name: flux-system
