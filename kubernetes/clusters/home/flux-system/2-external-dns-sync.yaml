apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: external-dns
  namespace: flux-system

spec:
  interval: 1h

  path: ./kubernetes/clusters/home/2-infra/external-dns

  prune: true
  wait: false

  dependsOn:
    - name: repositories
    - name: ingress-nginx
    - name: cert-issuer

  sourceRef:
    kind: GitRepository
    name: flux-system

  decryption:
    provider: sops
    secretRef:
      name: sops-age