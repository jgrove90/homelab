apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: cert-manager
  namespace: flux-system

spec:
  interval: 1h

  path: ./kubernetes/clusters/home/2-infra/cert-manager

  prune: true
  wait: true

  sourceRef:
    kind: GitRepository
    name: flux-system

  decryption:
    provider: sops
    secretRef:
      name: sops-age