apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: monitoring
  namespace: flux-system

spec:
  interval: 1h

  path: ./kubernetes/clusters/home/2-infra/monitoring

  prune: true
  wait: true
  timeout: 15m

  dependsOn:
    - name: repositories
    - name: cilium
    - name: gateway
    - name: local-path-provisioner
    - name: metrics-server

  sourceRef:
    kind: GitRepository
    name: flux-system

  decryption:
    provider: sops
    secretRef:
      name: sops-age
