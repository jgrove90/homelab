apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: repositories
  namespace: flux-system

spec:

  interval: 1h

  path: ./kubernetes/clusters/home/1-repos

  prune: true
  wait: true

  dependsOn:
    - name: namespaces

  sourceRef:
    kind: GitRepository
    name: flux-system