apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: gateway-api-crds
  namespace: flux-system

spec:
  interval: 24h

  # Upstream Gateway API standard-channel CRDs at the pinned tag.
  # Upgrading Gateway API = change the tag in 1-repos/gateway-api.yaml.
  path: ./config/crd/standard

  # Never let a Git mistake delete the CRDs (and with them every Gateway/Route)
  prune: false
  wait: true

  dependsOn:
    - name: repositories

  sourceRef:
    kind: GitRepository
    name: gateway-api
