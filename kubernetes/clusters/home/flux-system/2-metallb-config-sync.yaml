apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: metallb-config
  namespace: flux-system

spec:
  interval: 1h

  path: ./kubernetes/clusters/home/2-infra/metallb-config

  prune: true
  wait: true

  dependsOn:
    - name: metallb-system

  sourceRef:
    kind: GitRepository
    name: flux-system