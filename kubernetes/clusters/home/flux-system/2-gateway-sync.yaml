apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: gateway
  namespace: flux-system

spec:
  interval: 1h

  path: ./kubernetes/clusters/home/2-infra/gateway

  prune: true
  wait: false

  dependsOn:
    - name: repositories
    - name: cilium
    - name: cert-issuer
    - name: metallb-config
    - name: gateway-api-crds

  sourceRef:
    kind: GitRepository
    name: flux-system
