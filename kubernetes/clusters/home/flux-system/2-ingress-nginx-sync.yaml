apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: ingress-nginx
  namespace: flux-system

spec:
  interval: 1h

  path: ./kubernetes/clusters/home/2-infra/ingress-nginx

  prune: true
  wait: true

  dependsOn:
    - name: repositories
    - name: metallb

  sourceRef:
    kind: GitRepository
    name: flux-system