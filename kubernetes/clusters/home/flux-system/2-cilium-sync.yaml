apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: cilium
  namespace: flux-system

spec:
  interval: 1h

  path: ./kubernetes/clusters/home/2-infra/cilium

  prune: true
  wait: true

  dependsOn:
    - name: repositories

  sourceRef:
    kind: GitRepository
    name: flux-system
