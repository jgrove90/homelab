apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: apps
  namespace: flux-system

spec:

  interval: 1h

  path: ./kubernetes/clusters/home/4-apps

  prune: true
  wait: false

  dependsOn:
    - name: services

  sourceRef:
    kind: GitRepository
    name: flux-system

  decryption:
    provider: sops
    secretRef:
      name: sops-age