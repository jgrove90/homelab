apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: cert-issuer
  namespace: flux-system

spec:
  interval: 1h

  path: ./kubernetes/clusters/home/2-infra/cert-issuer

  prune: true
  wait: false

  dependsOn:
    - name: cert-manager

  sourceRef:
    kind: GitRepository
    name: flux-system

  decryption:
    provider: sops
    secretRef:
      name: sops-age