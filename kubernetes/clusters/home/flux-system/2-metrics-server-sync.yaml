apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: metrics-server
  namespace: flux-system

spec:
  interval: 1h

  path: ./kubernetes/clusters/home/2-infra/metrics-server

  prune: true
  wait: true

  dependsOn:
    - name: repositories
    - name: cilium
    - name: kubelet-cert-approver

  sourceRef:
    kind: GitRepository
    name: flux-system
