apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: services
  namespace: flux-system

spec:
  interval: 1h

  path: ./kubernetes/clusters/home/3-services

  prune: true
  wait: true

  dependsOn:
    - name: metallb
    - name: metallb-config
    - name: ingress-nginx
    - name: cert-manager
    - name: cert-issuer

  sourceRef:
    kind: GitRepository
    name: flux-system

  decryption:
    provider: sops
    secretRef:
      name: sops-age