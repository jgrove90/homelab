apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: cilium-lb
  namespace: flux-system

spec:
  interval: 1h

  path: ./kubernetes/clusters/home/2-infra/cilium-lb

  prune: true
  wait: true

  dependsOn:
    - name: cilium

  sourceRef:
    kind: GitRepository
    name: flux-system
